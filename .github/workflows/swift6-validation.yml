name: Swift 6 Validation

on:
  pull_request:
    branches:
      - Gen2
  push:
    branches:
      - Gen2

jobs:
  analyze:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Latest Installed Xcode
        run: |
          python3 - <<'PY'
          import glob
          import os

          candidates = sorted(glob.glob('/Applications/Xcode*.app'))
          if not candidates:
              raise SystemExit('No Xcode installation found under /Applications')

          selected = candidates[-1]
          print(f"Selected Xcode app: {selected}")
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f"DEVELOPER_DIR={selected}/Contents/Developer\n")
          PY

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Run Xcode Analyze
        run: |
          xcodebuild \
            -project "JJYWave.xcodeproj" \
            -scheme "JJYWave" \
            -configuration Debug \
            -destination "platform=macOS" \
            SWIFT_TREAT_WARNINGS_AS_ERRORS=YES \
            GCC_TREAT_WARNINGS_AS_ERRORS=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            analyze

  tests:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select Latest Installed Xcode
        run: |
          python3 - <<'PY'
          import glob
          import os

          candidates = sorted(glob.glob('/Applications/Xcode*.app'))
          if not candidates:
              raise SystemExit('No Xcode installation found under /Applications')

          selected = candidates[-1]
          print(f"Selected Xcode app: {selected}")
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as env_file:
              env_file.write(f"DEVELOPER_DIR={selected}/Contents/Developer\n")
          PY

      - name: Show Xcode Version
        run: xcodebuild -version

      - name: Run Xcode Tests
        run: |
          xcodebuild \
            test \
            -project "JJYWave.xcodeproj" \
            -scheme "JJYWaveTests" \
            -destination "platform=macOS" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO
