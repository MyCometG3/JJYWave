name: Strict Concurrency Check

on:
  pull_request:
    branches:
      - Gen2
  push:
    branches:
      - Gen2

jobs:
  strict-concurrency:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Run strict-concurrency diagnostics gate
        run: ./scripts/strict_concurrency_check.sh
